version: "3.9"

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: petsense_db
    environment:
      POSTGRES_USER: petsense
      POSTGRES_PASSWORD: petsense_secret
      POSTGRES_DB: petsense
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petsense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petsense_backend
    environment:
      DATABASE_URL: postgresql://petsense:petsense_secret@db:5432/petsense
      SECRET_KEY: change_me_in_production_use_a_long_random_string
      USE_REAL_MODELS: "false"
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: petsense_frontend
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # ─── Model Server (placeholder for ONNX Runtime / TorchServe) ────────────
  model-server:
    image: python:3.11-slim
    container_name: petsense_model_server
    working_dir: /app
    volumes:
      - ./ml:/app
    ports:
      - "8001:8001"
    command: >
      sh -c "pip install fastapi uvicorn onnxruntime numpy pillow --quiet &&
             echo 'Model server placeholder ready. Add real ONNX models to /ml/models/ and implement serving logic.' &&
             python -m http.server 8001"
    profiles:
      - model-server  # only start with: docker-compose --profile model-server up

volumes:
  postgres_data:
  backend_uploads:
